name: IPO Report

on:
  schedule:
    - cron: '30 3 * * *'

  workflow_dispatch:

jobs:
  send-report:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - run: python ipo_report.py
        env:
          EMAIL: ${{ secrets.EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
